image: python:3.12-slim

stages:
  - verify
  - deploy

verify_release:
  stage: verify
  script:
    - python -m unittest discover -s tests -p 'test_release.py'
    - python tools/verify_release.py

pages:
  stage: deploy
  script:
    - test -f site/index.html
  pages:
    publish: site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

